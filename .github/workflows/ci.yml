# Checks every push and pull request: lint, tests with coverage minimums,
# production build, then the browser tests. Nothing here uses real data,
# real emails or secrets: every job works on a temporary database.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push on the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs Node 22.5+; same major version as development.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests (with coverage minimums)
        run: npm run test:coverage
      - run: npm run build
        env:
          # The build reads the catalog from SQLite: keep it in a temp folder.
          DATA_DIR: ${{ runner.temp }}/nahel-build
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: Browser tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
